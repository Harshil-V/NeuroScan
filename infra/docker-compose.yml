name: neuroscan

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neuroscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuroscan}
      POSTGRES_DB: ${POSTGRES_DB:-neuroscan}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neuroscan}"]
      interval: 5s
      timeout: 3s
      retries: 10

  orthanc:
    image: orthancteam/orthanc:24.7.3
    restart: unless-stopped
    ports:
      - "8042:8042"
      - "4242:4242"
    volumes:
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc_data:/var/lib/orthanc/db
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request,base64,sys; r=urllib.request.Request('http://localhost:8042/system', headers={'Authorization':'Basic '+base64.b64encode(b'orthanc:orthanc').decode()}); urllib.request.urlopen(r,timeout=3).read()\" || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  api-service:
    build:
      context: ../services/api-service
      dockerfile: Dockerfile
    image: neuroscan/api-service:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-neuroscan}:${POSTGRES_PASSWORD:-neuroscan}@postgres:5432/${POSTGRES_DB:-neuroscan}
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: orthanc
      ORTHANC_PASSWORD: orthanc
      LOG_LEVEL: INFO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-neuroscan}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys;sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/health\",timeout=2).status==200 else 1)'"]
      interval: 10s
      timeout: 5s
      retries: 6

  web-viewer:
    build:
      context: ../apps/web-viewer
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    image: neuroscan/web-viewer:dev
    restart: unless-stopped
    depends_on:
      api-service:
        condition: service_started
    ports:
      - "5173:80"

volumes:
  postgres_data:
  orthanc_data:
  minio_data:
