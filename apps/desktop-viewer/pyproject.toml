[project]
name = "neuroscan-desktop-viewer"
version = "0.1.0"
description = "NeuroScan Workstation Qt desktop DICOM viewer"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "pyqtgraph>=0.13",
    "pydicom>=3.0",
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.1",
    "pylibjpeg-openjpeg>=2.2",
    "numpy>=2.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N806"]
# Qt widgets: signals are mixedCase and overridden methods (keyPressEvent,
# eventFilter, ...) are camelCase by Qt convention. Suppress PEP 8 naming
# checks for the widget package.
"app/widgets/**/*.py" = ["N802", "N815"]
