name: CI

on:
  pull_request:
  push:
    branches: [main, "slice-*"]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web-viewer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install api-service deps
        working-directory: services/api-service
        run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Bring up stack
        working-directory: infra
        run: docker compose up -d --build
      - name: Wait for api-service
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 2
          done
      - name: Run E2E
        working-directory: tests/e2e
        run: npm test
      - name: Tear down
        if: always()
        working-directory: infra
        run: docker compose down -v

  desktop-viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Qt headless dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-cursor0
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest tests/unit/ -q
        env:
          QT_QPA_PLATFORM: offscreen

  deid-drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PHI scanner files match
        run: ./scripts/check-deid-scanner-drift.sh
