[project]
name = "neuroscan-api-service"
version = "0.1.0"
description = "NeuroScan Workstation API service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pydicom>=3.0",
    "python-multipart>=0.0.12",
    "h5py>=3.12",
    "scikit-image>=0.24",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "numpy>=2.1",
    "moto[s3]>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/alembic/versions/*.py" = ["E501"]  # Alembic autogen lines can exceed length
"tests/**/*.py" = ["N806"]  # Allow SessionLocal (SQLAlchemy convention) in tests
"app/routes/*.py" = ["B008"]  # FastAPI uses Depends/File/Query in argument defaults
